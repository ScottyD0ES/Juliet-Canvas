<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PS2 Chronometer + Heavy-Mass Space Dispersion & Nebula Fade-In</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02040a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.6;
            pointer-events: none;
        }
        #hud span {
            color: #ffffff;
            font-weight: 600;
        }
        #controls {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 92%;
            max-width: 720px;
        }
        button {
            padding: 12px 20px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 50px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.55);
        }
        button:active {
            transform: scale(0.96);
        }
        button.active-state {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <div id="hud">
        <div>Mode: <span id="hudMode">Zero-G Standby</span></div>
        <div>Day Orb: <span id="hudDay">---</span></div>
        <div>Solar Ring: <span id="hudRing">100%</span></div>
        <div>Hour Anchor: <span id="hudHour">0.0°</span></div>
        <div>Orb 60s Sync: <span id="hudPhase">0%</span></div>
    </div>

    <canvas id="chronometerCanvas"></canvas>

    <div id="controls">
        <button id="btnBoot">First Boot Sequence</button>
        <button id="btnSelect">Select Item (Pulse)</button>
        <button id="btnCore">Activate Core</button>
        <button id="btnAxes">Toggle Axis Guides</button>
        <button id="btnTime" title="Click to step +3h; double-click for live time">Cycle Diurnal Time</button>
    </div>

    <script>
        const canvas = document.getElementById('chronometerCanvas');
        const ctx = canvas.getContext('2d');

        // HUD & Control Elements
        const hudMode = document.getElementById('hudMode');
        const hudDay = document.getElementById('hudDay');
        const hudRing = document.getElementById('hudRing');
        const hudHour = document.getElementById('hudHour');
        const hudPhase = document.getElementById('hudPhase');
        const btnBoot = document.getElementById('btnBoot');
        const btnSelect = document.getElementById('btnSelect');
        const btnCore = document.getElementById('btnCore');
        const btnAxes = document.getElementById('btnAxes');
        const btnTime = document.getElementById('btnTime');

        const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const FLIP_PERIOD_MS = 90000; // 90 seconds per full 360° coin flip
        const ORB_LOOP_DURATION_MS = 60000; // 60 seconds per full orb cascade cycle
        const X_DISC_PERIOD_MS = 3750; // 3.75 seconds per yellow X-axis ring revolution

        let width, height, centerX, centerY;

        // ==========================================
        // 1. GLOBAL STATE & EVENT TRIGGERS
        // ==========================================
        const BOOT_DURATION_MS = 2800;
        const BOOT_DETONATION_T = 0.75; // Dispersion triggers once the orb ring has come into frame

        const state = {
            isCoreActive: false,
            showAxes: false,
            hue: 202,
            nebulaOpacity: 0.0,
            particleBrightness: 0.28,
            isBooting: false,
            bootStartTime: 0,
            hasBootDetonated: false,
            bootBurstEnergy: 0,
            selectImpulse: 0,
            useSimulatedTime: false,
            simulatedHours: 12.0
        };

        window.ChronometerAPI = {
            triggerFirstBoot() {
                state.isCoreActive = false;
                btnCore.classList.remove('active-state');
                btnCore.textContent = 'Activate Core';
                hudMode.textContent = 'First Boot Z-Approach';

                state.isBooting = true;
                state.bootStartTime = performance.now();
                state.hasBootDetonated = false;
                state.bootBurstEnergy = 0;

                // Clear nebula clouds at boot start so they fade in with the stars after arrival
                state.nebulaOpacity = 0.0;

                particles.forEach(p => p.hideUntilRingArrives());
            },

            triggerItemSelect() {
                state.selectImpulse = 1.0;
                state.hue = (state.hue + 48) % 360;
                hudMode.textContent = 'Item Selected';

                particles.forEach(p => {
                    if (!state.isCoreActive) p.blastOut(0.45);
                });

                setTimeout(() => {
                    if (!state.isBooting) {
                        hudMode.textContent = state.isCoreActive ? 'Gravity Core Engaged' : 'Zero-G Standby';
                    }
                }, 900);
            },

            setCoreActive(active) {
                state.isCoreActive = active;
                if (active) {
                    btnCore.textContent = 'Deactivate Core';
                    btnCore.classList.add('active-state');
                    hudMode.textContent = 'Gravity Core Engaged';
                } else {
                    btnCore.textContent = 'Activate Core';
                    btnCore.classList.remove('active-state');
                    hudMode.textContent = 'Zero-G Standby';
                    particles.forEach(p => p.blastOut(1.0));
                }
            },

            toggleAxes() {
                state.showAxes = !state.showAxes;
                btnAxes.classList.toggle('active-state', state.showAxes);
            },

            cycleTestTime() {
                state.useSimulatedTime = true;
                state.simulatedHours = (state.simulatedHours + 3) % 24;
            },

            resetToLiveTime() {
                state.useSimulatedTime = false;
            }
        };

        // ==========================================
        // 2. FLOWING NEBULA CLOUD SYSTEM
        // ==========================================
        const nebulaClouds = [];
        const NUM_CLOUDS = 7;

        function initNebulaClouds() {
            nebulaClouds.length = 0;
            for (let i = 0; i < NUM_CLOUDS; i++) {
                nebulaClouds.push({
                    baseX: Math.random() * width,
                    baseY: Math.random() * height,
                    radius: Math.max(width, height) * (0.35 + Math.random() * 0.28),
                    phaseX: Math.random() * Math.PI * 2,
                    phaseY: Math.random() * Math.PI * 2,
                    speedX: (Math.random() * 0.00025 + 0.00012) * (Math.random() < 0.5 ? 1 : -1),
                    speedY: (Math.random() * 0.00025 + 0.00012) * (Math.random() < 0.5 ? 1 : -1),
                    driftRangeX: width * (0.18 + Math.random() * 0.15),
                    driftRangeY: height * (0.18 + Math.random() * 0.15),
                    hueShift: (Math.random() - 0.5) * 28,
                    lightness: 11 + Math.random() * 6
                });
            }
        }

        // ==========================================
        // 3. 3-AXIS GIMBAL & WALL-CLOCK SYNC
        // ==========================================
        const gimbal = {
            baseRingRadius: 200,
            depthPerspective: 620,
            xDiscAngle: 0,
            yFlipAngle: 0.65,
            zRollAngle: 0
        };

        const NUM_ORBS = 7;
        const orbs = [];

        function initOrbs() {
            orbs.length = 0;
            for (let i = 0; i < NUM_ORBS; i++) {
                orbs.push({
                    index: i, // 0 = Sun, 1 = Mon, ..., 6 = Sat
                    baseAngle: (i / NUM_ORBS) * Math.PI * 2,
                    pulsePhase: (i / NUM_ORBS) * Math.PI * 2
                });
            }
        }

        function getTimeMetrics() {
            const nowDate = new Date();
            const activeDayIndex = nowDate.getDay();
            const msIntoMinute = nowDate.getSeconds() * 1000 + nowDate.getMilliseconds();

            // 60-second wall-clock cycle for the orbs cascade: 0.0 -> 1.0 every 60s (at :00)
            const orbCycleProgress = msIntoMinute / ORB_LOOP_DURATION_MS;

            // 3.75s X-ring cycle progress
            const xDiscCycleProgress = (nowDate.getTime() % X_DISC_PERIOD_MS) / X_DISC_PERIOD_MS;

            // Timed 90s coin flip progress using epoch ms so it never resets mid-rotation
            const flipCycleProgress = (nowDate.getTime() % FLIP_PERIOD_MS) / FLIP_PERIOD_MS;

            let hours24;
            if (state.useSimulatedTime) {
                hours24 = state.simulatedHours;
            } else {
                hours24 = nowDate.getHours() + nowDate.getMinutes() / 60 + msIntoMinute / 3600000;
            }

            // Clockwise 12-hour dial angle: 0° = 12 o'clock (top), 90° = 3 o'clock
            const hour12 = hours24 % 12;
            const hourClockDeg = (hour12 / 12) * 360;

            // Canvas radian angle (-PI/2 shifts 0 rad from 3 o'clock to 12 o'clock top)
            const hourAngle = (hourClockDeg * Math.PI) / 180 - Math.PI / 2;

            // Solar arc: 0.0 at midnight (0h / 24h), 1.0 at high noon (12h)
            const dayProgress = hours24 / 24;
            const solarArc = (1 - Math.cos(dayProgress * Math.PI * 2)) / 2;

            // Ring radius scales smoothly from smallest at midnight (0.72x) to largest at high noon (1.22x)
            const solarRingScale = 0.72 + solarArc * 0.50;

            // Diurnal breathing scale for orbs
            const breathWave = (Math.cos(dayProgress * Math.PI * 2) + 1) / 2;
            const diurnalOrbScale = 0.65 + breathWave * 0.75;

            return {
                activeDayIndex,
                hours24,
                hourClockDeg,
                hourAngle,
                solarRingScale,
                diurnalOrbScale,
                msIntoMinute,
                orbCycleProgress,
                xDiscCycleProgress,
                flipCycleProgress
            };
        }

        // Soft feathered ease-out for a gentle glide into place at the end of boot
        function easeOutFeather(t) {
            return 1 - Math.pow(1 - t, 4.5);
        }

        // Keeps stars & nebula hidden until the orb ring enters frame, then triggers heavy-mass dispersion
        function getBootKinematics(now) {
            if (!state.isBooting) {
                return {
                    zApproachOffset: 0,
                    radialSpread: 1.0,
                    isBootMassConverged: false,
                    hideBootBurstParticles: false
                };
            }

            const elapsed = now - state.bootStartTime;
            if (elapsed >= BOOT_DURATION_MS) {
                state.isBooting = false;
                hudMode.textContent = state.isCoreActive ? 'Gravity Core Engaged' : 'Zero-G Standby';
                return {
                    zApproachOffset: 0,
                    radialSpread: 1.0,
                    isBootMassConverged: false,
                    hideBootBurstParticles: false
                };
            }

            const t = elapsed / BOOT_DURATION_MS; // 0.0 -> 1.0
            const feathered = easeOutFeather(t);

            // Z-zoom approaches from deep background (+2200) to foreground (0) with a soft cushion
            const zApproachOffset = (1 - feathered) * 2200;
            const radialSpread = feathered;

            // Fire the heavy-mass space dispersion once the orb ring comes into frame
            if (t >= BOOT_DETONATION_T && !state.hasBootDetonated) {
                state.hasBootDetonated = true;
                state.bootBurstEnergy = 1.0;
                hudMode.textContent = 'Starfield Dispersion';
                particles.forEach(p => p.triggerHeavySpaceBurst());
            }

            return {
                zApproachOffset,
                radialSpread,
                isBootMassConverged: radialSpread < 0.04,
                hideBootBurstParticles: !state.hasBootDetonated
            };
        }

        // 3-Axis Rotation Pipeline + Z-Depth Approach Offset
        function transform3Axis(x, y, z, zApproachOffset = 0) {
            const cosD = Math.cos(gimbal.xDiscAngle);
            const sinD = Math.sin(gimbal.xDiscAngle);
            const x1 = x * cosD - y * sinD;
            const y1 = x * sinD + y * cosD;
            const z1 = z;

            const cosF = Math.cos(gimbal.yFlipAngle);
            const sinF = Math.sin(gimbal.yFlipAngle);
            const x2 = x1;
            const y2 = y1 * cosF - z1 * sinF;
            const z2 = y1 * sinF + z1 * cosF;

            const cosR = Math.cos(gimbal.zRollAngle);
            const sinR = Math.sin(gimbal.zRollAngle);
            const x3 = x2 * cosR - y2 * sinR;
            const y3 = x2 * sinR + y2 * cosR;
            const z3 = z2 + zApproachOffset;

            const scale = gimbal.depthPerspective / Math.max(40, gimbal.depthPerspective + z3);
            return {
                screenX: centerX + x3 * scale,
                screenY: centerY + y3 * scale,
                scale: scale,
                zDepth: z3
            };
        }

        // ==========================================
        // 4. 3D CHAOTIC SPHERICAL PARTICLE SYSTEM
        // ==========================================
        const PARTICLE_COUNT = 420;
        const particles = [];

        class Particle {
            constructor() {
                this.x = (Math.random() - 0.5) * width;
                this.y = (Math.random() - 0.5) * height;
                this.z = (Math.random() - 0.5) * 400;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const speed = Math.random() * 0.16 + 0.04;

                this.vx = Math.sin(phi) * Math.cos(theta) * speed;
                this.vy = Math.sin(phi) * Math.sin(theta) * speed;
                this.vz = Math.cos(phi) * speed;
                this.baseSpeed = speed;

                // Individual inertial mass & rotational drift for heavy-body zero-G dispersion
                this.mass = 0.65 + Math.random() * 0.95;
                this.driftSpin = (Math.random() - 0.5) * 0.024;
                this.dispersionFade = 1.0;

                this.size = Math.random() * 1.1 + 0.55;
                this.alpha = Math.random() * 0.6 + 0.4;
                this.twinkleSpeed = Math.random() * 0.02 + 0.008;
                this.twinklePhase = Math.random() * Math.PI * 2;

                const axisTheta = Math.random() * Math.PI * 2;
                const axisPhi = Math.acos(2 * Math.random() - 1);
                this.spinAxis = {
                    x: Math.sin(axisPhi) * Math.cos(axisTheta),
                    y: Math.sin(axisPhi) * Math.sin(axisTheta),
                    z: Math.cos(axisPhi)
                };

                this.precessAxis = {
                    x: Math.random() - 0.5,
                    y: Math.random() - 0.5,
                    z: Math.random() - 0.5
                };
                const pLen = Math.hypot(this.precessAxis.x, this.precessAxis.y, this.precessAxis.z) || 1;
                this.precessAxis.x /= pLen;
                this.precessAxis.y /= pLen;
                this.precessAxis.z /= pLen;

                this.orbitalSpeed = Math.random() * 1.6 + 1.8;
                this.radiusOffset = (Math.random() - 0.5) * 3;
            }

            // Keeps burst particles dormant at the center until the orb ring enters frame
            hideUntilRingArrives() {
                this.x = 0;
                this.y = 0;
                this.z = 0;
                this.vx = 0;
                this.vy = 0;
                this.vz = 0;
                this.dispersionFade = 0;
            }

            // Heavy-mass zero-G explosion: particles billow outward with inertia, curved drift, and gradual drag
            triggerHeavySpaceBurst() {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const nx = Math.sin(phi) * Math.cos(theta);
                const ny = Math.sin(phi) * Math.sin(theta);
                const nz = Math.cos(phi);

                // Tangential swirl + mass-weighted impulse so heavier particles drift closer and lighter ones carry farther
                const swirl = (Math.random() - 0.5) * 0.55;
                const dirX = nx - ny * swirl;
                const dirY = ny + nx * swirl;

                const reachDistribution = Math.pow(Math.random(), 0.58);
                const maxField = Math.max(width, height) * 0.54;
                const impulse = ((0.032 * maxField) * (0.14 + reachDistribution * 0.92)) / Math.sqrt(this.mass);

                this.x = nx * (3 + Math.random() * 8);
                this.y = ny * (3 + Math.random() * 8);
                this.z = nz * (3 + Math.random() * 8);

                this.vx = dirX * impulse;
                this.vy = dirY * impulse;
                this.vz = nz * (impulse * 0.52);
                this.dispersionFade = 0.05;
            }

            blastOut(multiplier = 1.0) {
                const dist = Math.hypot(this.x, this.y, this.z) || 0.001;
                const nx = this.x / dist + (Math.random() - 0.5) * 0.45;
                const ny = this.y / dist + (Math.random() - 0.5) * 0.45;
                const nz = this.z / dist + (Math.random() - 0.5) * 0.45;

                const blastForce = (Math.random() * 11 + 4) * multiplier;
                this.vx = nx * blastForce;
                this.vy = ny * blastForce;
                this.vz = nz * blastForce;
                this.dispersionFade = 1.0;
            }

            update(bootKinematics) {
                this.twinklePhase += this.twinkleSpeed;

                if (bootKinematics.hideBootBurstParticles) {
                    this.x = 0;
                    this.y = 0;
                    this.z = 0;
                    this.vx = 0;
                    this.vy = 0;
                    this.vz = 0;
                    this.dispersionFade = 0;
                    return;
                }

                // Smoothly fade each star particle in as it drifts out of the central burst
                if (this.dispersionFade < 1.0) {
                    this.dispersionFade = Math.min(1.0, this.dispersionFade + 0.032);
                }

                if (state.isCoreActive) {
                    const sphereRadius = Math.min(width, height) * 0.055 + this.radiusOffset;
                    const dist = Math.hypot(this.x, this.y, this.z) || 0.001;

                    const rx = this.x / dist;
                    const ry = this.y / dist;
                    const rz = this.z / dist;

                    const radialError = dist - sphereRadius;
                    const radialPull = -radialError * 0.22;

                    const precessionRate = 0.03;
                    const sx = this.spinAxis.x + (this.precessAxis.y * this.spinAxis.z - this.precessAxis.z * this.spinAxis.y) * precessionRate;
                    const sy = this.spinAxis.y + (this.precessAxis.z * this.spinAxis.x - this.precessAxis.x * this.spinAxis.z) * precessionRate;
                    const sz = this.spinAxis.z + (this.precessAxis.x * this.spinAxis.y - this.precessAxis.y * this.spinAxis.x) * precessionRate;
                    const sLen = Math.hypot(sx, sy, sz) || 1;
                    this.spinAxis.x = sx / sLen;
                    this.spinAxis.y = sy / sLen;
                    this.spinAxis.z = sz / sLen;

                    let tx = this.spinAxis.y * rz - this.spinAxis.z * ry;
                    let ty = this.spinAxis.z * rx - this.spinAxis.x * rz;
                    let tz = this.spinAxis.x * ry - this.spinAxis.y * rx;
                    const tLen = Math.hypot(tx, ty, tz) || 0.001;
                    tx /= tLen;
                    ty /= tLen;
                    tz /= tLen;

                    const targetVx = tx * this.orbitalSpeed + rx * radialPull;
                    const targetVy = ty * this.orbitalSpeed + ry * radialPull;
                    const targetVz = tz * this.orbitalSpeed + rz * radialPull;

                    this.vx += (targetVx - this.vx) * 0.18;
                    this.vy += (targetVy - this.vy) * 0.18;
                    this.vz += (targetVz - this.vz) * 0.18;

                    this.x += this.vx;
                    this.y += this.vy;
                    this.z += this.vz;
                } else {
                    const currentSpeed = Math.hypot(this.vx, this.vy, this.vz);
                    if (currentSpeed > this.baseSpeed) {
                        // Gentle curved zero-G drift while decelerating under viscous space drag
                        const cosDrift = Math.cos(this.driftSpin);
                        const sinDrift = Math.sin(this.driftSpin);
                        const rotatedVx = this.vx * cosDrift - this.vy * sinDrift;
                        const rotatedVy = this.vx * sinDrift + this.vy * cosDrift;

                        // Heavier particles hold momentum slightly longer (0.964 - 0.974 drag)
                        const drag = 0.962 + (this.mass - 0.65) * 0.012;
                        this.vx = rotatedVx * drag;
                        this.vy = rotatedVy * drag;
                        this.vz *= drag;
                    } else {
                        this.vx += (Math.random() - 0.5) * 0.008;
                        this.vy += (Math.random() - 0.5) * 0.008;
                        this.vz += (Math.random() - 0.5) * 0.008;
                        const speed = Math.hypot(this.vx, this.vy, this.vz);
                        if (speed > this.baseSpeed) {
                            this.vx = (this.vx / speed) * this.baseSpeed;
                            this.vy = (this.vy / speed) * this.baseSpeed;
                            this.vz = (this.vz / speed) * this.baseSpeed;
                        }
                    }

                    this.x += this.vx;
                    this.y += this.vy;
                    this.z += this.vz;

                    const halfW = width / 2 + 20;
                    const halfH = height / 2 + 20;
                    if (this.x < -halfW) this.x = halfW;
                    if (this.x > halfW) this.x = -halfW;
                    if (this.y < -halfH) this.y = halfH;
                    if (this.y > halfH) this.y = -halfH;
                    if (this.z < -250) this.z = 250;
                    if (this.z > 250) this.z = -250;
                }
            }

            draw(activeHue, bootKinematics) {
                if (bootKinematics.hideBootBurstParticles || this.dispersionFade <= 0.01) return;

                const focalLength = 520;
                const scale = focalLength / Math.max(40, focalLength + this.z);
                const screenX = centerX + this.x * scale;
                const screenY = centerY + this.y * scale;

                const isHighEnergy = state.isCoreActive || state.bootBurstEnergy > 0.05;
                const depthFade = isHighEnergy ? Math.max(0.35, Math.min(1.15, scale)) : 1;
                const rawAlpha = Math.max(0.2, Math.min(1, (this.alpha + Math.sin(this.twinklePhase) * 0.25) * depthFade));
                const burstBoost = state.bootBurstEnergy * 0.55;
                const effectiveBrightness = Math.min(1.0, state.particleBrightness + burstBoost);
                const currentAlpha = rawAlpha * effectiveBrightness * this.dispersionFade;
                const renderedSize = this.size * scale * (0.85 + this.mass * 0.25);

                const glowRadius = isHighEnergy ? renderedSize * 4.2 : renderedSize * 3.0;
                const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, glowRadius);

                gradient.addColorStop(0, `hsla(${activeHue}, 100%, 92%, ${currentAlpha})`);
                gradient.addColorStop(0.35, `hsla(${activeHue}, 100%, 60%, ${currentAlpha * 0.65})`);
                gradient.addColorStop(1, `hsla(${activeHue}, 100%, 50%, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(screenX, screenY, glowRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha * 0.85})`;
                ctx.beginPath();
                ctx.arc(screenX, screenY, renderedSize * 0.55, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ==========================================
        // 5. RESIZE & EVENT WIRING
        // ==========================================
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;

            gimbal.baseRingRadius = Math.min(width, height) * 0.28;
            gimbal.depthPerspective = gimbal.baseRingRadius * 3.1;

            initNebulaClouds();
        }

        window.addEventListener('resize', resize);
        resize();
        initOrbs();

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        // Button Bindings
        btnBoot.addEventListener('click', () => window.ChronometerAPI.triggerFirstBoot());
        btnSelect.addEventListener('click', () => window.ChronometerAPI.triggerItemSelect());
        btnCore.addEventListener('click', () => window.ChronometerAPI.setCoreActive(!state.isCoreActive));
        btnAxes.addEventListener('click', () => window.ChronometerAPI.toggleAxes());
        btnTime.addEventListener('click', () => window.ChronometerAPI.cycleTestTime());
        btnTime.addEventListener('dblclick', () => window.ChronometerAPI.resetToLiveTime());

        // ==========================================
        // 6. RENDER PIPELINE
        // ==========================================
        function drawBackground(activeHue, bootKinematics) {
            // Keep nebula hidden until stars emerge after ring arrival, then fade it in gently with the stars
            const isHiddenDuringBoot = bootKinematics.hideBootBurstParticles;
            const targetNebulaOpacity = (state.isCoreActive || isHiddenDuringBoot) ? 0.0 : 0.16;
            const fadeRate = isHiddenDuringBoot ? 1.0 : (state.isCoreActive ? 0.05 : 0.018);
            state.nebulaOpacity += (targetNebulaOpacity - state.nebulaOpacity) * fadeRate;

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = state.isCoreActive ? 'rgba(2, 3, 6, 0.36)' : 'rgba(2, 4, 10, 0.36)';
            ctx.fillRect(0, 0, width, height);

            if (state.nebulaOpacity > 0.002) {
                ctx.globalCompositeOperation = 'screen';

                for (let i = 0; i < nebulaClouds.length; i++) {
                    const cloud = nebulaClouds[i];
                    cloud.phaseX += cloud.speedX * 16;
                    cloud.phaseY += cloud.speedY * 16;

                    const x = cloud.baseX + Math.sin(cloud.phaseX) * cloud.driftRangeX;
                    const y = cloud.baseY + Math.cos(cloud.phaseY) * cloud.driftRangeY;
                    const cloudHue = (activeHue + cloud.hueShift + 360) % 360;

                    const cloudGrad = ctx.createRadialGradient(x, y, 0, x, y, cloud.radius);
                    cloudGrad.addColorStop(0, `hsla(${cloudHue}, 85%, ${cloud.lightness}%, ${state.nebulaOpacity})`);
                    cloudGrad.addColorStop(0.55, `hsla(${cloudHue}, 80%, ${cloud.lightness * 0.6}%, ${state.nebulaOpacity * 0.45})`);
                    cloudGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                    ctx.fillStyle = cloudGrad;
                    ctx.beginPath();
                    ctx.arc(x, y, cloud.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalCompositeOperation = 'source-over';
            }

            // Soft diffuse glow swell as the space particles begin dispersing
            if (state.bootBurstEnergy > 0.01) {
                const progress = 1 - state.bootBurstEnergy;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';

                const bloomRadius = Math.min(width, height) * (0.08 + progress * 0.32);
                const bloomGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, bloomRadius);
                bloomGrad.addColorStop(0, `hsla(${activeHue}, 100%, 84%, ${state.bootBurstEnergy * 0.32})`);
                bloomGrad.addColorStop(0.45, `hsla(${activeHue}, 100%, 58%, ${state.bootBurstEnergy * 0.16})`);
                bloomGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = bloomGrad;
                ctx.beginPath();
                ctx.arc(centerX, centerY, bloomRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function drawAxisGuides(ringRadius, hourAngle, zApproachOffset) {
            if (!state.showAxes) return;

            ctx.save();
            ctx.lineWidth = 1;

            // 1. Outer 12-Hour Dial & Hour Marker (Z-Axis Target)
            const dialRadius = ringRadius * 1.25;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
            ctx.beginPath();
            ctx.arc(centerX, centerY, dialRadius, 0, Math.PI * 2);
            ctx.stroke();

            for (let h = 0; h < 12; h++) {
                const a = (h / 12) * Math.PI * 2 - Math.PI / 2;
                const inner = dialRadius - 6;
                ctx.beginPath();
                ctx.moveTo(centerX + Math.cos(a) * inner, centerY + Math.sin(a) * inner);
                ctx.lineTo(centerX + Math.cos(a) * dialRadius, centerY + Math.sin(a) * dialRadius);
                ctx.stroke();
            }

            // Active Hour Hand Vector & Convergence Target Dot (Cyan)
            const targetX = centerX + Math.cos(hourAngle) * dialRadius;
            const targetY = centerY + Math.sin(hourAngle) * dialRadius;
            ctx.strokeStyle = 'rgba(0, 225, 255, 0.55)';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(targetX, targetY);
            ctx.stroke();

            ctx.fillStyle = 'rgba(0, 225, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(targetX, targetY, 4, 0, Math.PI * 2);
            ctx.fill();

            // 2. X-Axis Orb Track Ring (Yellow — 1 full revolution every 3.75s via gimbal.xDiscAngle)
            ctx.strokeStyle = 'rgba(255, 210, 60, 0.55)';
            ctx.beginPath();
            const segments = 64;
            for (let s = 0; s <= segments; s++) {
                const theta = (s / segments) * Math.PI * 2;
                const pt = transform3Axis(Math.cos(theta) * ringRadius, Math.sin(theta) * ringRadius, 0, zApproachOffset);
                if (s === 0) ctx.moveTo(pt.screenX, pt.screenY);
                else ctx.lineTo(pt.screenX, pt.screenY);
            }
            ctx.stroke();

            const zeroPt = transform3Axis(ringRadius, 0, 0, zApproachOffset);
            ctx.fillStyle = 'rgba(255, 220, 90, 0.95)';
            ctx.beginPath();
            ctx.arc(zeroPt.screenX, zeroPt.screenY, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // 3. Y-Axis Flip Axis Line (Magenta)
            const pLeft = transform3Axis(-ringRadius * 1.15, 0, 0, zApproachOffset);
            const pRight = transform3Axis(ringRadius * 1.15, 0, 0, zApproachOffset);
            ctx.strokeStyle = 'rgba(255, 80, 180, 0.45)';
            ctx.beginPath();
            ctx.moveTo(pLeft.screenX, pLeft.screenY);
            ctx.lineTo(pRight.screenX, pRight.screenY);
            ctx.stroke();

            ctx.restore();
        }

        function drawChronometerRing(activeHue, timeMetrics, bootKinematics) {
            const orbProgress = timeMetrics.orbCycleProgress;

            // Yellow X-axis ring completes 1 full 360° revolution every 3.75s
            gimbal.xDiscAngle = timeMetrics.xDiscCycleProgress * Math.PI * 2;

            // Y-axis coin flip completes 1 full 360° rotation every 90 seconds, anchored to clock time
            gimbal.yFlipAngle = 0.65 + timeMetrics.flipCycleProgress * Math.PI * 2;

            // Z-axis coin roll stays anchored to the current hour angle
            gimbal.zRollAngle = timeMetrics.hourAngle;

            const fullRingRadius = gimbal.baseRingRadius * timeMetrics.solarRingScale * (1 + state.selectImpulse * 0.14);
            const activeOrbOrbitRadius = fullRingRadius * bootKinematics.radialSpread;

            drawAxisGuides(fullRingRadius, timeMetrics.hourAngle, bootKinematics.zApproachOffset);

            // Evenly stepped lap cadence across the 7 orbs over each 60s cycle (2, 3, 4, 5, 6, 7, 8 laps)
            const projectedOrbs = orbs.map(orb => {
                const lapsThisCycle = 2 + orb.index;
                const cascadeOffset = orbProgress * Math.PI * 2 * lapsThisCycle;
                const angle = timeMetrics.hourAngle + orb.baseAngle + cascadeOffset;

                const lx = activeOrbOrbitRadius * Math.cos(angle);
                const ly = activeOrbOrbitRadius * Math.sin(angle);
                const lz = 0;

                const proj = transform3Axis(lx, ly, lz, bootKinematics.zApproachOffset);
                proj.orb = orb;
                return proj;
            });

            projectedOrbs.sort((a, b) => b.zDepth - a.zDepth);

            projectedOrbs.forEach(proj => {
                const orb = proj.orb;
                orb.pulsePhase += 0.05;
                const pulse = (Math.sin(orb.pulsePhase) + 1) / 2;

                // Subtle 12% size lift for the orb representing the current day of the week
                const dayOfWeekBoost = orb.index === timeMetrics.activeDayIndex ? 1.12 : 1.0;

                const massBoost = bootKinematics.isBootMassConverged ? 1.45 : 1.0;
                const baseRadius = 8.5 * timeMetrics.diurnalOrbScale * dayOfWeekBoost * massBoost * (1 + state.selectImpulse * 0.45);
                const radius = baseRadius * proj.scale * (1 + pulse * 0.25);

                const rawDepthAlpha = gimbal.depthPerspective / (gimbal.depthPerspective + Math.max(0, proj.zDepth * 0.35));
                const depthAlpha = Math.max(0.25, Math.min(0.95, rawDepthAlpha));

                ctx.shadowBlur = 24 * proj.scale;
                ctx.shadowColor = `hsla(${activeHue}, 100%, 55%, ${0.85 * depthAlpha})`;

                const gradient = ctx.createRadialGradient(
                    proj.screenX, proj.screenY, 0,
                    proj.screenX, proj.screenY, radius * 1.6
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${0.95 * depthAlpha})`);
                gradient.addColorStop(0.28, `rgba(255, 255, 255, ${0.75 * depthAlpha})`);
                gradient.addColorStop(0.62, `hsla(${activeHue}, 100%, 55%, ${0.55 * depthAlpha})`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(proj.screenX, proj.screenY, radius * 1.6, 0, Math.PI * 2);
                ctx.fill();

                if (state.showAxes && orb.index === 0) {
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255, 220, 100, 0.9)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(proj.screenX, proj.screenY, radius * 1.3, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.shadowBlur = 0;
                ctx.fillStyle = `rgba(255, 255, 255, ${0.4 * depthAlpha})`;
                ctx.beginPath();
                ctx.arc(proj.screenX, proj.screenY, radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function animate() {
            const now = performance.now();
            const timeMetrics = getTimeMetrics();
            const bootKinematics = getBootKinematics(now);

            state.selectImpulse *= 0.92;
            state.bootBurstEnergy *= 0.94;

            const colorSpeed = state.isCoreActive ? 0.85 : 0.12;
            state.hue = (state.hue + colorSpeed) % 360;

            const targetBrightness = state.isCoreActive ? 1.0 : 0.28;
            state.particleBrightness += (targetBrightness - state.particleBrightness) * (state.isCoreActive ? 0.08 : 0.03);

            const orbProgress = timeMetrics.orbCycleProgress;

            hudDay.textContent = `${DAY_NAMES[timeMetrics.activeDayIndex]} (#${timeMetrics.activeDayIndex + 1})`;
            hudRing.textContent = `${Math.round(timeMetrics.solarRingScale * 100)}%`;
            hudHour.textContent = `${timeMetrics.hourClockDeg.toFixed(1)}° (${timeMetrics.hours24.toFixed(2)}h)`;
            hudPhase.textContent = `${Math.round(orbProgress * 100)}% (${(timeMetrics.msIntoMinute / 1000).toFixed(1)}s / 60s)`;

            drawBackground(state.hue, bootKinematics);

            ctx.globalCompositeOperation = 'source-over';
            drawChronometerRing(state.hue, timeMetrics, bootKinematics);

            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(bootKinematics);
                particles[i].draw(state.hue, bootKinematics);
            }

            requestAnimationFrame(animate);
        }

        window.ChronometerAPI.triggerFirstBoot();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
