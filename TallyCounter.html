<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally Counter App</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            transition: background-color 0.4s ease;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            pointer-events: none;
        }

        /* Upper Middle Counter */
        .counter-container {
            margin-top: 20px;
            text-align: center;
            z-index: 10;
        }

        #counter-text {
            font-size: 8rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        /* Mid-Screen Right Reset Button */
        .reset-btn {
            position: absolute;
            top: 50%;
            right: 25px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 16px; /* Squircle style */
            cursor: pointer;
            z-index: 20;
            pointer-events: auto;
            transition: background-color 0.2s, transform 0.1s;
        }

        .reset-btn:active {
            transform: translateY(-50%) scale(0.95);
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Lower Control Panel */
        .lower-panel {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
            margin-bottom: 20px;
            pointer-events: auto;
        }

        .toggle-factorial-btn {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #ffffff;
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .toggle-factorial-btn:hover {
            border-color: #ffffff;
        }

        .factorial-controls {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.3s ease, max-height 0.3s ease;
        }

        .factorial-controls.visible {
            opacity: 1;
            max-height: 60px;
        }

        .factorial-input {
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px;
            font-size: 1rem;
            border-radius: 10px;
            width: 100px;
            text-align: center;
            outline: none;
        }

        .apply-factorial-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .apply-factorial-btn:active {
            opacity: 0.8;
        }

        /* Canvas covering full screen */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="counter-container">
            <h1 id="counter-text">0</h1>
        </div>

        <button class="reset-btn" id="resetBtn">Reset</button>

        <div class="lower-panel">
            <button class="toggle-factorial-btn" id="toggleFactorialBtn">Show Multiplier</button>
            <div class="factorial-controls" id="factorialControls">
                <input type="number" id="multiplierInput" class="factorial-input" value="1" min="1" step="any">
                <button class="apply-factorial-btn" id="applyBtn">Multiply</button>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const counterText = document.getElementById('counter-text');
        const resetBtn = document.getElementById('resetBtn');
        const toggleFactorialBtn = document.getElementById('toggleFactorialBtn');
        const factorialControls = document.getElementById('factorialControls');
        const multiplierInput = document.getElementById('multiplierInput');

        let count = 0;
        let flashAlpha = 0;
        let flashColor = '0, 255, 100';

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function flashScreen(type) {
            if (type === 'increase') {
                flashColor = '0, 255, 100';
            } else {
                flashColor = '255, 50, 50';
            }
            flashAlpha = 0.35;
        }

        function updateDisplay() {
            counterText.textContent = count.toLocaleString();
        }

        // --- Particle & Ripple Background Systems ---
        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.maxRadius = 120 + Math.random() * 50;
                this.opacity = 0.7;
            }
            update() {
                this.radius += 2.5;
                this.opacity *= 0.96;
            }
            draw() {
                ctx.strokeStyle = `rgba(56, 189, 248, ${this.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        class DustParticle {
            constructor(type = 'ambient') {
                this.type = type; // 'ambient', 'positive', 'negative'
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.baseSize = Math.random() * 2 + 1;
                this.size = this.baseSize;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4 - 0.1;
                this.hueOffset = Math.random() * 360;
                this.alpha = Math.random() * 0.5 + 0.2;
                this.maxAlpha = this.alpha;
                this.fadingOut = false;
                this.fadeRate = 0.12 + Math.random() * 0.08; // Extremely fast, immediate fade-out speed
            }
            update() {
                if (this.fadingOut) {
                    this.alpha -= this.fadeRate;
                    if (this.alpha < 0) this.alpha = 0;
                    return;
                }

                this.x += this.speedX;
                this.y += this.speedY;

                this.hueOffset = (this.hueOffset + 0.2) % 360;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                if (this.alpha <= 0.001) return;

                ctx.save();
                ctx.globalAlpha = this.alpha;

                if (this.type === 'ambient') {
                    let currentHue = (200 + Math.sin(this.hueOffset * 0.05) * 30);
                    ctx.fillStyle = `hsl(${currentHue}, 70%, 80%)`;
                } else if (this.type === 'positive') {
                    let currentHue = (130 + Math.sin(this.hueOffset * 0.08) * 40);
                    ctx.fillStyle = `hsl(${currentHue}, 80%, 65%)`;
                } else if (this.type === 'negative') {
                    let currentHue = (350 + Math.sin(this.hueOffset * 0.08) * 20);
                    ctx.fillStyle = `hsl(${currentHue}, 85%, 60%)`;
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let ripples = [];
        let particles = [];

        // Initialize ambient base dust particles
        for (let i = 0; i < 50; i++) {
            particles.push(new DustParticle('ambient'));
        }

        function adjustDynamicParticles(type) {
            let countToAdd = 4;
            for (let i = 0; i < countToAdd; i++) {
                particles.push(new DustParticle(type));
            }
        }

        function triggerResetTransition() {
            // Instantaneous trigger with tightest minimal staggered delay for rapid simultaneous dissolve
            let delayIndex = 0;
            particles.forEach((p) => {
                if (p.type !== 'ambient') {
                    setTimeout(() => {
                        p.fadingOut = true;
                    }, delayIndex * 3); // Minimal 3ms step creates an immediate wave sweep effect
                    delayIndex++;
                }
            });

            // Clean up fully invisible dead particles from memory almost instantly
            setTimeout(() => {
                particles = particles.filter(p => p.type === 'ambient' || p.alpha > 0);
            }, 300);
        }

        function animateBackground() {
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#020617');
            bgGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                if (ripples[i].opacity < 0.02 || ripples[i].radius > ripples[i].maxRadius) {
                    ripples.splice(i, 1);
                }
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(${flashColor}, ${flashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                flashAlpha -= 0.02;
            }

            requestAnimationFrame(animateBackground);
        }
        animateBackground();

        // Interaction Handlers
        let startX = 0;
        let startY = 0;
        let pointerMoved = false;

        canvas.addEventListener('pointerdown', (e) => {
            startX = e.clientX;
            startY = e.clientY;
            pointerMoved = false;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (Math.hypot(e.clientX - startX, e.clientY - startY) > 20) {
                pointerMoved = true;
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            ripples.push(new Ripple(e.clientX, e.clientY));
            let multiplier = parseFloat(multiplierInput.value) || 1;

            if (pointerMoved) {
                count -= multiplier;
                flashScreen('decrease');
                adjustDynamicParticles('negative');
            } else {
                count += multiplier;
                flashScreen('increase');
                adjustDynamicParticles('positive');
            }
            updateDisplay();
        });

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            count = 0;
            updateDisplay();
            triggerResetTransition();
        });

        toggleFactorialBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isVisible = factorialControls.classList.toggle('visible');
            toggleFactorialBtn.textContent = isVisible ? 'Hide Multiplier' : 'Show Multiplier';
        });

        factorialControls.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
</body>
</html>
