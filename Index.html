<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JULIET CANVAS</title>
  <style>
    /* Dark, film-grain style background */
    body {
      background-color: #0d0d0d;
      color: #ffb834; /* Industrial cyber amber */
      font-family: "Impact", "Arial Narrow", Arial, sans-serif;
      margin: 0;
      padding: 2vw;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Screen container simulating CRT/LED framing */
    .screen {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 4 / 3;
      border: 1px solid #ffb834;
      padding: 30px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 0 20px rgba(255, 184, 52, 0.15), 0 0 20px rgba(255, 184, 52, 0.05);
    }

    /* Outer framing L-shaped Crop Marks */
    .screen::before, .screen::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border: 1px solid #ffb834;
      pointer-events: none;
    }
    .screen::before { top: -5px; left: -5px; border-right: none; border-bottom: none; }
    .screen::after { bottom: -5px; right: -5px; border-left: none; border-top: none; }

    /* Fine Inner Border */
    .inner-border {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border: 1px solid rgba(255, 184, 52, 0.2);
      pointer-events: none;
    }

    /* Utility Framing Texts */
    .metadata {
      font-family: monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      opacity: 0.8;
      letter-spacing: 1px;
    }
    .meta-top { display: flex; justify-content: space-between; margin-bottom: 25px; }
    .meta-bottom { display: flex; justify-content: space-between; margin-top: auto; padding-top: 25px; }

    /* Header Section */
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #ffb834;
      padding-bottom: 15px;
      margin-bottom: 35px;
    }

    h1 {
      margin: 0;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
    }

    /* Rotating Orb Loader Container */
    .orb-canvas-container {
      width: 50px;
      height: 50px;
    }

    /* Menu Area */
    .menu-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin-bottom: 14px;
    }

    /* Clickable interactive anchors */
    a {
      display: inline-block;
      color: #ffb834;
      text-decoration: none;
      font-size: 2.2rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 2px 14px;
      transition: background-color 0.1s, color 0.1s;
    }

    /* Active styling matches original dark highlight box */
    a:hover {
      background-color: #ffb834;
      color: #0d0d0d;
    }

    #status {
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="screen">
    <div class="inner-border"></div>
    
    <!-- Top Meta Details -->
    <div class="meta-top metadata">
      <span>REV. 0.42</span>
      <span>SYS.RDY</span>
    </div>

    <!-- Header & Flat Rotating Orbs Animation -->
    <div class="header-area">
      <h1>JULIET CANVAS</h1>
      <div class="orb-canvas-container">
        <canvas id="orbCanvas" width="100" height="100" style="width: 50px; height: 50px;"></canvas>
      </div>
    </div>

    <!-- Live Menu Loaded From GitHub -->
    <div class="menu-container">
      <div id="status">INITIALIZING REPOSITORY FETCH...</div>
      <ul id="menu-list"></ul>
    </div>

    <!-- Bottom Meta Details -->
    <div class="meta-bottom metadata">
      <span>REV. 0.42</span>
      <span>SYS.RDY</span>
    </div>
  </div>

  <script>
    // --- GITHUB CONFIGURATION ---
    const GITHUB_USERNAME = "YOUR_USERNAME";
    const REPO_NAME = "YOUR_REPO";
    const FOLDER_PATH = ""; // Leave as "" for root, or "folder-name" if scripts are in a subfolder
    // ----------------------------

    const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FOLDER_PATH}`;
    const menuList = document.getElementById("menu-list");
    const statusEl = document.getElementById("status");

    // Transforms filename patterns like "03-grid-animation.html" to "GRID ANIMATION"
    function formatScriptName(filename) {
      return filename
        .replace(/\.html$/i, "")
        .replace(/^\d+[-_]/, "") // Strip prefix ordering numbers if any
        .replace(/[-_]+/g, " ")
        .toUpperCase();
    }

    // Canvas rotation loop for the top-right loading indicator
    function startOrbAnimation() {
      const canvas = document.getElementById("orbCanvas");
      const ctx = canvas.getContext("2d");
      const numOrbs = 8;
      const radius = 35; // Orbit ring size
      const orbRadius = 6; // Orb size
      let angleOffset = 0;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Find center of canvas
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        for (let i = 0; i < numOrbs; i++) {
          // Calculate even angular spacing + rotation animation offset
          const angle = (i * (Math.PI * 2) / numOrbs) + angleOffset;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius;

          // Introduce a trail fade/pulse: older/preceding orbs are dimmer
          // Create gradient-like alpha to make the clockwise motion clear
          const alpha = 0.2 + (i / numOrbs) * 0.8;

          ctx.beginPath();
          ctx.arc(x, y, orbRadius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 184, 52, ${alpha})`;
          ctx.fill();
        }

        // Control CW (clockwise) rotation speed here
        angleOffset += 0.035;
        requestAnimationFrame(draw);
      }
      draw();
    }

    async function buildMenu() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`Fetch error: ${response.status}`);

        const files = await response.json();

        // Target .html files, ignoring the menu directory file
        const htmlScripts = files.filter(item => 
          item.type === "file" &&
          item.name.toLowerCase().endsWith(".html") &&
          item.name.toLowerCase() !== "index.html"
        );

        if (htmlScripts.length === 0) {
          statusEl.textContent = "NO UTILITIES FOUND IN REPOSITORY";
          return;
        }

        statusEl.style.display = "none";

        htmlScripts.forEach(file => {
          const li = document.createElement("li");
          const link = document.createElement("a");
          
          link.href = FOLDER_PATH ? `${FOLDER_PATH}/${file.name}` : file.name;
          link.textContent = formatScriptName(file.name);
          
          li.appendChild(link);
          menuList.appendChild(li);
        });

      } catch (error) {
        statusEl.textContent = "SYSTEM FETCH FAILED - CHECK SOURCE";
        console.error(error);
      }
    }

    // Initialize animation & parse GitHub
    startOrbAnimation();
    buildMenu();
  </script>
</body>
</html>
