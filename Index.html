<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Juliet // System Utilities</title>
    <style>
        /* Reset and layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #f1f5f9;
        }

        /* Fullscreen Canvas Background */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Foreground Menu Overlay */
        .ui-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            overflow-y: auto;
        }

        .sys-header {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 162, 255, 0.25);
        }

        .sys-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #e0f2fe;
            text-shadow: 0 0 12px rgba(0, 162, 255, 0.7);
        }

        .sys-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.06em;
            color: #7dd3fc;
            background: rgba(0, 162, 255, 0.12);
            border: 1px solid rgba(0, 162, 255, 0.3);
            padding: 4px 10px;
            border-radius: 99px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
        }

        .status-dot.ready {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        /* Menu Grid */
        .menu-container {
            width: 100%;
            max-width: 520px;
            margin: auto 0;
            padding: 20px 0;
        }

        .menu-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: rgba(125, 211, 252, 0.75);
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #f8fafc;
            background: rgba(6, 16, 30, 0.58);
            border: 1px solid rgba(0, 162, 255, 0.28);
            border-radius: 16px;
            padding: 16px 18px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .menu-card:hover,
        .menu-card:active {
            transform: translateX(4px) scale(0.995);
            background: rgba(0, 162, 255, 0.16);
            border-color: rgba(56, 189, 248, 0.75);
            box-shadow: 0 0 22px rgba(0, 162, 255, 0.35);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: rgba(0, 162, 255, 0.15);
            border: 1px solid rgba(0, 162, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            font-weight: 700;
            color: #38bdf8;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            flex-shrink: 0;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: #f1f5f9;
        }

        .card-desc {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .card-arrow {
            font-size: 1.1rem;
            color: #38bdf8;
            opacity: 0.8;
            padding-left: 10px;
        }

        .sys-footer {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: rgba(148, 163, 184, 0.7);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            padding-top: 10px;
        }
    </style>
</head>

        <main class="menu-container">
            <div class="menu-label">Browser Utilities</div>
            <div class="menu-grid" id="menuGrid"></div>
        </main>

        <footer class="sys-footer">
            <span id="clockDisplay">--:--:--</span>
            <span>LOCAL CACHE ENABLED</span>
        </footer>
    </div>
