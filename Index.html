<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Juliet // System Utilities</title>
    <style>
        /* Reset and layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #f1f5f9;
        }

        /* Fullscreen Canvas Background */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Foreground Menu Overlay */
        .ui-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            overflow-y: auto;
        }

        .sys-header {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 162, 255, 0.25);
        }

        .sys-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #e0f2fe;
            text-shadow: 0 0 12px rgba(0, 162, 255, 0.7);
        }

        .sys-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.06em;
            color: #7dd3fc;
            background: rgba(0, 162, 255, 0.12);
            border: 1px solid rgba(0, 162, 255, 0.3);
            padding: 4px 10px;
            border-radius: 99px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
        }

        .status-dot.ready {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        /* Menu Grid */
        .menu-container {
            width: 100%;
            max-width: 520px;
            margin: auto 0;
            padding: 20px 0;
        }

        .menu-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: rgba(125, 211, 252, 0.75);
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #f8fafc;
            background: rgba(6, 16, 30, 0.58);
            border: 1px solid rgba(0, 162, 255, 0.28);
            border-radius: 16px;
            padding: 16px 18px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .menu-card:hover,
        .menu-card:active {
            transform: translateX(4px) scale(0.995);
            background: rgba(0, 162, 255, 0.16);
            border-color: rgba(56, 189, 248, 0.75);
            box-shadow: 0 0 22px rgba(0, 162, 255, 0.35);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: rgba(0, 162, 255, 0.15);
            border: 1px solid rgba(0, 162, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            font-weight: 700;
            color: #38bdf8;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            flex-shrink: 0;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: #f1f5f9;
        }

        .card-desc {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .card-arrow {
            font-size: 1.1rem;
            color: #38bdf8;
            opacity: 0.8;
            padding-left: 10px;
        }

        .sys-footer {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: rgba(148, 163, 184, 0.7);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <canvas id="ps2Canvas"></canvas>

    <div class="ui-layer">
        <header class="sys-header">
            <div class="sys-title">JULIET // OS</div>
            <div class="sys-status">
                <span class="status-dot" id="swDot"></span>
                <span id="swText">SYNCING</span>
            </div>
        </header>

        <main class="menu-container">
            <div class="menu-label">Browser Utilities</div>
            <div class="menu-grid" id="menuGrid"></div>
        </main>

        <footer class="sys-footer">
            <span id="clockDisplay">--:--:--</span>
            <span>LOCAL CACHE ENABLED</span>
        </footer>
    </div>

    <script>
        // =========================================================================
        // 1. MENU CONFIGURATION (ADD NEW UTILITIES HERE)
        // =========================================================================
        const UTILITIES = [
            {
                title: "Barcode Generator",
                desc: "Code 128 & Code 39 scannable barcode utility",
                file: "BarcodeGenerator.html",
                code: "BAR"
            },
            {
                title: "Vault Encoder",
                desc: "AES-256-GCM local file encryption & decryption",
                file: "encoder.html",
                code: "ENC"
            },
            {
                title: "Tally Counter",
                desc: "Multi-register counter & quantity tracker",
                file: "TallyCounter.html",
                code: "CNT"
            }
        ];

        const menuGrid = document.getElementById("menuGrid");
        UTILITIES.forEach(item => {
            const link = document.createElement("a");
            link.className = "menu-card";
            link.href = item.file;
            link.innerHTML = `
                <div class="card-left">
                    <div class="card-icon">${item.code}</div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.desc}</div>
                    </div>
                </div>
                <div class="card-arrow">&#8250;</div>
            `;
            menuGrid.appendChild(link);
        });

        // Live System Clock
        function updateClock() {
            const now = new Date();
            document.getElementById("clockDisplay").textContent = now.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // =========================================================================
        // 2. PS2 OS ORB RING CHRONOMETER CANVAS ENGINE
        // =========================================================================
        const canvas = document.getElementById('ps2Canvas');
        const ctx = canvas.getContext('2d');

        const config = {
            ringSpeedFactor: 4.0,
            orbPulseFactor: 1.0,
            axisSpeedFactor: 5.0,
            tiltAngle: 0.7,
            color: '#00a2ff',
            cloudOpacity: 0.3,
            ringRadius: 200,
            depthPerspective: 350,
        };

        const orbs = [];
        const numOrbs = 7;
        let cloudParticles = [];
        const PS2_SPEEDS = [2.0, 1.9, 1.8, 1.7, 1.6, 1.5, 1.4];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            config.ringRadius = Math.min(canvas.width, canvas.height) * 0.28;
            config.depthPerspective = config.ringRadius * 1.8;
            initCloud();
        }

        function initOrbs() {
            for (let i = 0; i < numOrbs; i++) {
                orbs.push({
                    baseAngle: (i / numOrbs) * Math.PI * 2,
                    currentAngleOffset: 0,
                    speedMultiplier: PS2_SPEEDS[i],
                    pulsePhase: Math.random() * Math.PI * 2,
                });
            }
        }

        function initCloud() {
            cloudParticles = [];
            for (let i = 0; i < 50; i++) {
                cloudParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    radius: Math.random() * 2 + 0.5,
                });
            }
        }

        function project3D(x, y, z, centerX, centerY) {
            const tiltCos = Math.cos(config.tiltAngle);
            const tiltSin = Math.sin(config.tiltAngle);
            
            const tiltedX = x;
            const tiltedY = y * tiltCos - z * tiltSin;
            const tiltedZ = y * tiltSin + z * tiltCos;

            const scale = config.depthPerspective / (config.depthPerspective + tiltedZ);
            
            return {
                screenX: tiltedX * scale + centerX,
                screenY: tiltedY * scale + centerY,
                scale: scale,
                zDepth: tiltedZ
            };
        }

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 162, b: 255 };
        }

        function draw() {
            ctx.fillStyle = `rgba(0, 0, 0, ${1 - config.cloudOpacity})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const rgb = hexToRgb(config.color);

            ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.2)`;
            cloudParticles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            const projectedOrbs = orbs.map(orb => {
                orb.currentAngleOffset += 0.005 * config.ringSpeedFactor * orb.speedMultiplier;
                const totalAngle = orb.baseAngle + orb.currentAngleOffset;

                const startX = config.ringRadius * Math.cos(totalAngle);
                const startY = config.ringRadius * Math.sin(totalAngle);
                const startZ = 0;

                const projection = project3D(startX, startY, startZ, centerX, centerY);
                projection.orbConfig = orb;
                return projection;
            });

            config.tiltAngle += 0.002 * config.axisSpeedFactor;
            projectedOrbs.sort((a, b) => b.zDepth - a.zDepth);

            projectedOrbs.forEach(proj => {
                const orb = proj.orbConfig;
                orb.pulsePhase += 0.05 * config.orbPulseFactor;
                const pulse = (Math.sin(orb.pulsePhase) + 1) / 2;

                const baseRadius = 8;
                const radius = baseRadius * proj.scale * (1 + pulse * 0.3);
                const depthAlpha = Math.max(0.1, Math.min(0.9, (config.depthPerspective / (config.depthPerspective + proj.zDepth))));

                ctx.shadowBlur = 25 * proj.scale;
                ctx.shadowColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.8 * depthAlpha})`;
                
                const gradient = ctx.createRadialGradient(
                    proj.screenX, proj.screenY, 0,
                    proj.screenX, proj.screenY, radius
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${0.9 * depthAlpha})`);
                gradient.addColorStop(0.2, `rgba(255, 255, 255, ${0.7 * depthAlpha})`);
                gradient.addColorStop(0.6, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.5 * depthAlpha})`);
                gradient.addColorStop(1, `rgba(0, 0, 0, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(proj.screenX, proj.screenY, radius * 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 * depthAlpha})`;
                ctx.beginPath();
                ctx.arc(proj.screenX, proj.screenY, radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resizeCanvas);
        initOrbs();
        resizeCanvas();
        requestAnimationFrame(draw);

        // =========================================================================
        // 3. OFFLINE SERVICE WORKER REGISTRATION & PRE-CACHE
        // =========================================================================
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/Juliet-Canvas/sw.js")
                    .then(() => {
                        document.getElementById("swDot").classList.add("ready");
                        document.getElementById("swText").textContent = "OFFLINE READY";
                        UTILITIES.forEach(u => fetch(u.file).catch(() => {}));
                    })
                    .catch(() => {
                        document.getElementById("swText").textContent = "ONLINE ONLY";
                    });
            });
        }
    </script>
</body>
</html>
