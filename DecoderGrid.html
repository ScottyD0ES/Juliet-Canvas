<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>RGC36 — Mechanical Grid Sandbox</title>
<style>
  :root {
    --bg-deep: #070510;
    --panel-bg: rgba(16, 12, 30, 0.84);
    --panel-border: rgba(155, 118, 245, 0.25);
    --accent-purple: #a855f7;
    --accent-pink: #ec4899;
    --accent-cyan: #38bdf8;
    --accent-green: #4ade80;
    --accent-yellow: #facc15;
    --accent-orange: #fb923c;
    --text-main: #f8fafc;
    --text-dim: #94a3b8;
    --cell-bg: rgba(11, 8, 22, 0.92);
    --cell-border: rgba(148, 120, 224, 0.22);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-x pan-y;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  /* Reactive Nebula & Particle Canvas */
  #nebula-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Main App Shell */
  .app-shell {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    width: 100%;
    padding: 12px;
    gap: 12px;
  }

  /* Desktop & iPad Landscape: Maximized Grid Left, Controls Right */
  @media (min-width: 900px) {
    .app-shell {
      flex-direction: row;
      height: 100dvh;
      overflow: hidden;
      padding: 16px 20px;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    .grid-stage {
      flex: 1 1 auto;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .master-outer-rim {
      width: auto;
      height: auto;
    }

    .grid-arena {
      width: min(calc(100dvh - 68px), calc(100vw - 480px));
      height: min(calc(100dvh - 68px), calc(100vw - 480px));
    }

    .control-sidebar {
      flex: 0 0 400px;
      width: 400px;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      padding-right: 4px;
    }
  }

  /* Mobile Portrait: Controls Top, Full-Width Exact Square Grid Bottom */
  @media (max-width: 899px) {
    .app-shell {
      flex-direction: column;
      padding: 10px;
      gap: 10px;
    }

    .control-sidebar {
      order: 1;
      width: 100%;
    }

    .grid-stage {
      order: 2;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-bottom: 20px;
    }

    .master-outer-rim {
      width: 100%;
      max-width: 560px;
      height: auto;
      padding: 12px 12px 18px 12px;
    }

    .grid-arena {
      width: 100%;
      aspect-ratio: 1 / 1;
      height: auto;
    }
  }

  .control-sidebar::-webkit-scrollbar {
    width: 5px;
  }
  .control-sidebar::-webkit-scrollbar-thumb {
    background: rgba(168, 85, 247, 0.35);
    border-radius: 4px;
  }

  /* Glass Cards */
  .card {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 11px 13px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  }

  .control-sidebar {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  /* Header & Modes */
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .brand-title {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    background: linear-gradient(90deg, #38bdf8, #c084fc, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .rotor-badge {
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 0.74rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #7dd3fc;
  }

  .mode-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    background: rgba(8, 6, 18, 0.75);
    padding: 4px;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.07);
  }

  .mode-btn {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 7px 6px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .mode-btn.active {
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.45), rgba(56, 189, 248, 0.3));
    color: #fff;
    border: 1px solid rgba(216, 180, 254, 0.35);
  }

  /* Field Labels & Inputs */
  .field-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 0.67rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .field-label span.highlight {
    color: var(--accent-cyan);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .field-label span.highlight.mod4-tint {
    color: var(--accent-yellow);
  }

  .field-label span.highlight.mod10-tint {
    color: var(--accent-orange);
  }

  .keyword-row {
    display: flex;
    gap: 7px;
  }

  input[type="text"], textarea {
    width: 100%;
    background: rgba(7, 5, 16, 0.88);
    border: 1px solid rgba(168, 120, 255, 0.3);
    border-radius: 8px;
    color: #fff;
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 0.85rem;
    padding: 8px 10px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent-cyan);
  }

  textarea {
    resize: vertical;
    min-height: 64px;
    line-height: 1.4;
  }

  .btn-action {
    flex: 0 0 auto;
    background: linear-gradient(135deg, #7e22ce, #be185d);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    padding: 0 12px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.1s ease, filter 0.18s ease;
  }

  .btn-action:active {
    transform: scale(0.96);
  }

  /* Compact 2x2 Grid Action Matrix */
  .utility-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }

  .btn-toggle {
    background: rgba(14, 11, 28, 0.9);
    border: 1px solid rgba(168, 120, 255, 0.35);
    color: #e2e8f0;
    border-radius: 8px;
    padding: 8px 8px;
    font-size: 0.74rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s ease;
  }

  .btn-toggle:active {
    transform: scale(0.97);
  }

  .btn-toggle.active,
  .btn-toggle.accent-cyan {
    background: rgba(56, 189, 248, 0.16);
    border-color: rgba(56, 189, 248, 0.5);
    color: #e0f2fe;
  }

  .btn-toggle.active {
    background: rgba(56, 189, 248, 0.26);
    border-color: var(--accent-cyan);
    color: #fff;
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.28);
  }

  /* Tappable 36-Char Keyed Sequence Card */
  .tai-card {
    cursor: pointer;
    user-select: none;
  }

  .tai-strip {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 3px;
  }

  @media (max-width: 899px) {
    .tai-strip {
      grid-template-columns: repeat(18, 1fr);
    }
  }

  .tai-chip {
    background: rgba(10, 8, 22, 0.9);
    border: 1px solid rgba(168, 120, 255, 0.2);
    border-radius: 4px;
    padding: 2px 1px;
    text-align: center;
    line-height: 1.1;
  }

  .tai-chip.key-driver {
    border-color: rgba(56, 189, 248, 0.6);
    background: rgba(56, 189, 248, 0.12);
  }

  .tai-chip .c-char {
    font-size: 0.68rem;
    font-weight: 800;
    color: #fff;
  }

  .tai-chip .c-idx {
    font-size: 0.56rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .tai-chip .c-idx.mod4-val {
    color: var(--accent-yellow);
  }

  .tai-chip .c-idx.mod10-val {
    color: var(--accent-orange);
  }

  /* Outer Tappable Master Frame Rim */
  .master-outer-rim {
    position: relative;
    padding: 16px 16px 20px 16px;
    border-radius: 18px;
    background: rgba(14, 10, 30, 0.65);
    border: 2px solid rgba(168, 120, 255, 0.36);
    box-shadow:
      0 22px 55px rgba(0, 0, 0, 0.7),
      inset 0 0 24px rgba(168, 85, 247, 0.14);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rim-hint-bottom {
    position: absolute;
    left: 50%;
    bottom: 4px;
    transform: translateX(-50%);
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: rgba(148, 163, 184, 0.75);
    pointer-events: none;
    white-space: nowrap;
  }

  /* Fixed Square Grid Arena: Houses Both Static Bed & Physical Rotating Carrier */
  .grid-arena {
    position: relative;
    cursor: pointer;
  }

  /* Layer 1: Static Reference Bed (01..36 Row-by-Row, NEVER Rotates) */
  .static-bed {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 4px;
    z-index: 1;
  }

  .static-cell {
    position: relative;
    background: var(--cell-bg);
    border: 1px solid var(--cell-border);
    border-radius: 7px;
    overflow: hidden;
  }

  /* Static Reference Perimeter Glyphs */
  .ref-tl {
    position: absolute;
    top: 3px;
    left: 4px;
    font-size: clamp(0.54rem, 1.3vmin, 0.92rem);
    font-weight: 800;
    color: var(--accent-cyan);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .ref-tr {
    position: absolute;
    top: 3px;
    right: 4px;
    font-size: clamp(0.54rem, 1.3vmin, 0.92rem);
    font-weight: 800;
    color: var(--accent-green);
    line-height: 1;
  }

  .ref-bl {
    position: absolute;
    bottom: 3px;
    left: 4px;
    font-size: clamp(0.54rem, 1.3vmin, 0.92rem);
    font-weight: 800;
    color: var(--accent-yellow);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .ref-bm {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(0.62rem, 1.5vmin, 1.08rem);
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .ref-br {
    position: absolute;
    bottom: 3px;
    right: 4px;
    font-size: clamp(0.54rem, 1.3vmin, 0.92rem);
    font-weight: 800;
    color: var(--accent-orange);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* Layer 2: Physical Gimbaled Carrier (Exact 1:1 Lock with Static Bed) */
  .master-carrier {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 4px;
    z-index: 2;
    pointer-events: none;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }

  .quad-carrier {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }

  .moving-slot {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gimbal-glyph {
    font-size: clamp(1.05rem, 3.3vmin, 2.6rem);
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(168, 85, 247, 0.5);
    line-height: 1;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    will-change: transform;
  }

  /* Symbol Swap Mode: Hide Moving Letters & Maximize Static Symbols to Center */
  .grid-arena.symbol-swap-mode .gimbal-glyph {
    opacity: 0;
  }

  .grid-arena.symbol-swap-mode .ref-bm {
    bottom: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(1.02rem, 3.1vmin, 2.4rem);
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(56, 189, 248, 0.55);
  }

  .io-section {
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .io-section.visible {
    display: flex;
  }

  .btn-secondary {
    background: rgba(56, 189, 248, 0.16);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #bae6fd;
    padding: 3px 9px;
    font-size: 0.7rem;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 700;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.68rem;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<canvas id="nebula-canvas"></canvas>

<div class="app-shell">
  <!-- LEFT (Desktop/iPad) / BOTTOM (Mobile): Tappable Master Rim + Dual-Layer Grid -->
  <main class="grid-stage">
    <div class="master-outer-rim" id="master-outer-rim">
      <div class="grid-arena" id="grid-arena">
        <!-- Layer 1: Static Reference Bed (01..36 Row-by-Row) -->
        <div class="static-bed" id="static-bed"></div>
        <!-- Layer 2: Physical Rotating Gimbaled Carrier -->
        <div class="master-carrier" id="master-carrier">
          <div class="quad-carrier" id="quad-carrier-0"></div>
          <div class="quad-carrier" id="quad-carrier-1"></div>
          <div class="quad-carrier" id="quad-carrier-2"></div>
          <div class="quad-carrier" id="quad-carrier-3"></div>
        </div>
      </div>
      <span class="rim-hint-bottom" id="rim-config-footer">MASTER MOD 1 (0°) · SCREEN Q1–Q4: 1111</span>
    </div>
  </main>

  <!-- RIGHT (Desktop/iPad) / TOP (Mobile): Controls & Telemetry Sidebar -->
  <aside class="control-sidebar">
    <!-- Brand & Mode Tabs -->
    <section class="card">
      <div class="brand-row">
        <div class="brand-title">RGC36 SANDBOX</div>
        <span class="rotor-badge" id="rotor-state-badge">1 | 1111</span>
      </div>
      <div class="mode-tabs">
        <button class="mode-btn active" data-mode="reference">Reference</button>
        <button class="mode-btn" data-mode="encode">Live Encode</button>
        <button class="mode-btn" data-mode="decode">Live Decode</button>
      </div>
    </section>

    <!-- Keyword Input (Loads Flat 1 | 1111 in Reference Mode) -->
    <section class="card">
      <div class="field-label">
        <span>Cipher Keyword (Loads Flat 1 | 1111)</span>
        <span class="highlight" id="key-len-label">STANDARD TAI</span>
      </div>
      <div class="keyword-row">
        <input type="text" id="keyword-input" placeholder="BLANK = STANDARD TAI" autocomplete="off" spellcheck="false" />
        <button class="btn-action" id="spin-key-btn">Spin Key</button>
      </div>
    </section>

    <!-- Streamlined Grid & Rotor Controls -->
    <section class="card">
      <div class="field-label">
        <span>Master & Screen Quadrant Controls</span>
        <span class="highlight" id="master-angle-label">MOD 1 · 0° (HINT A)</span>
      </div>
      <div class="utility-grid">
        <button class="btn-toggle accent-cyan" id="cycle-master-btn">Rotate Master (Mod 1 → 2)</button>
        <button class="btn-toggle accent-cyan" id="apply-key-rotors-btn">Engage Key Mod 4</button>
        <button class="btn-toggle" id="swap-symbols-btn">Swap Symbols / Chars</button>
        <button class="btn-toggle" id="reset-flat-btn">Reset 1 | 1111</button>
      </div>
    </section>

    <!-- Live Encode / Decode Workspace -->
    <section class="card io-section" id="io-card">
      <div>
        <div class="field-label">
          <span id="io-input-label">Plaintext Input</span>
          <span class="highlight" id="first-char-info">1ST CHAR: —</span>
        </div>
        <textarea id="io-input" placeholder="Type message to encode..."></textarea>
      </div>
      <div>
        <div class="field-label">
          <span id="io-output-label">RGC36 Ciphertext Output</span>
          <button class="btn-secondary" id="copy-output-btn">Copy</button>
        </div>
        <textarea id="io-output" readonly placeholder="Output appears here..."></textarea>
      </div>
      <div class="status-bar">
        <span id="ioc-readout">IoC: —</span>
        <span id="hint-readout">Tail Hint: —</span>
      </div>
    </section>

    <!-- Tappable 36-Char Keyed Sequence (Toggles Mod 4 / Mod 10 on Tap) -->
    <section class="card tai-card" id="tai-card">
      <div class="field-label">
        <span>Keyed Sequence (Tap to Toggle)</span>
        <span class="highlight mod4-tint" id="tai-mode-label">TAI MOD 4</span>
      </div>
      <div class="tai-strip" id="tai-strip"></div>
    </section>
  </aside>
</div>

<script>
(() => {
  // Prevent iOS Safari pinch-to-zoom gestures
  document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
  document.addEventListener("gesturechange", e => e.preventDefault(), { passive: false });
  document.addEventListener("touchmove", e => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  // Standard 36-character Base-36 / TAI sequence (01=A .. 26=Z, 27=0 .. 36=9)
  const STD_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  // Static Reference Symbol Legend mapped to TAI 01..36
  const STATIC_SYMBOLS = [
    "⇧",   // 01 | A | Capitalize / Uppercase
    "↵",   // 02 | B | Line Break
    ".",   // 03 | C | Period
    ",",   // 04 | D | Comma
    "!",   // 05 | E | Exclamation Mark
    "?",   // 06 | F | Question Mark
    '"',   // 07 | G | Double Quote
    "'",   // 08 | H | Single Quote / Apostrophe
    "-",   // 09 | I | Hyphen / Dash
    ":",   // 10 | J | Colon
    ";",   // 11 | K | Semicolon
    "/",   // 12 | L | Forward Slash
    "¶",   // 13 | M | Paragraph Break
    "---", // 14 | N | Section Divider
    "@",   // 15 | O | At Sign
    "#",   // 16 | P | Hash / Number Sign
    "$",   // 17 | Q | Dollar Sign
    "%",   // 18 | R | Percent Sign
    "(",   // 19 | S | Open Parenthesis
    ")",   // 20 | T | Close Parenthesis
    "&",   // 21 | U | Ampersand
    "_",   // 22 | V | Underscore
    "+",   // 23 | W | Plus Sign
    "=",   // 24 | X | Equals Sign
    "*",   // 25 | Y | Asterisk
    "°",   // 26 | Z | Degree Sign
    "[",   // 27 | 0 | Open Square Bracket
    "]",   // 28 | 1 | Close Square Bracket
    "{",   // 29 | 2 | Open Curly Brace
    "}",   // 30 | 3 | Close Curly Brace
    "<",   // 31 | 4 | Less Than / Open Angle
    ">",   // 32 | 5 | Greater Than / Close Angle
    "\\",  // 33 | 6 | Backslash
    "|",   // 34 | 7 | Vertical Pipe
    "~",   // 35 | 8 | Tilde
    "→99"  // 36 | 9 | Step-99 No-Op Spacer
  ];

  // Clockwise ring order of screen quadrants: 0=TL (Q1), 1=TR (Q2), 3=BR (Q4), 2=BL (Q3)
  const CW_RING = [0, 1, 3, 2];

  // Application State
  const state = {
    mode: "reference",        // 'reference' | 'encode' | 'decode'
    keyword: "",
    keyedAlphabet: STD_ALPHABET.split(""),
    masterMod4: 1,            // 1..4
    masterDeg: 0,             // Cumulative degrees for smooth CW rotation
    subMod4: [1, 1, 1, 1],    // Orientation (1..4) of underlying sub-grids 0..3
    subDeg: [0, 0, 0, 0],     // Cumulative degrees for smooth CW rotation
    symbolSwapMode: false,
    taiStripMode: "mod4"      // 'mod4' | 'mod10'
  };

  // DOM References
  const masterOuterRim = document.getElementById("master-outer-rim");
  const gridArenaEl = document.getElementById("grid-arena");
  const staticBedEl = document.getElementById("static-bed");
  const masterCarrierEl = document.getElementById("master-carrier");
  const quadCarrierEls = [
    document.getElementById("quad-carrier-0"),
    document.getElementById("quad-carrier-1"),
    document.getElementById("quad-carrier-2"),
    document.getElementById("quad-carrier-3")
  ];
  const rimConfigFooter = document.getElementById("rim-config-footer");
  const rotorStateBadge = document.getElementById("rotor-state-badge");
  const keywordInput = document.getElementById("keyword-input");
  const spinKeyBtn = document.getElementById("spin-key-btn");
  const keyLenLabel = document.getElementById("key-len-label");
  const cycleMasterBtn = document.getElementById("cycle-master-btn");
  const applyKeyRotorsBtn = document.getElementById("apply-key-rotors-btn");
  const swapSymbolsBtn = document.getElementById("swap-symbols-btn");
  const resetFlatBtn = document.getElementById("reset-flat-btn");
  const masterAngleLabel = document.getElementById("master-angle-label");
  const taiCard = document.getElementById("tai-card");
  const taiModeLabel = document.getElementById("tai-mode-label");
  const taiStripEl = document.getElementById("tai-strip");
  const modeBtns = document.querySelectorAll(".mode-btn");
  const ioCard = document.getElementById("io-card");
  const ioInput = document.getElementById("io-input");
  const ioOutput = document.getElementById("io-output");
  const ioInputLabel = document.getElementById("io-input-label");
  const ioOutputLabel = document.getElementById("io-output-label");
  const firstCharInfo = document.getElementById("first-char-info");
  const iocReadout = document.getElementById("ioc-readout");
  const hintReadout = document.getElementById("hint-readout");
  const copyOutputBtn = document.getElementById("copy-output-btn");

  // Helper: True Alphabet Index (1..36)
  function getTAI(char) {
    const idx = STD_ALPHABET.indexOf(char.toUpperCase());
    return idx === -1 ? 0 : idx + 1;
  }

  // Helper: TAI Modulo 4 mapped to 1..4 (where mod 0 -> 4)
  function getMod4(tai) {
    if (tai <= 0) return 1;
    const r = tai % 4;
    return r === 0 ? 4 : r;
  }

  // Helper: TAI Modulo 10 mapped to 1..0 (1..9, 0)
  function getMod10Display(tai) {
    return tai % 10;
  }

  // Build deduplicated 36-char keyed sequence
  function buildKeyedAlphabet(kw) {
    const clean = (kw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const seen = new Set();
    const result = [];
    for (const ch of clean) {
      if (!seen.has(ch)) {
        seen.add(ch);
        result.push(ch);
      }
    }
    for (const ch of STD_ALPHABET) {
      if (!seen.has(ch)) {
        seen.add(ch);
        result.push(ch);
      }
    }
    return result;
  }

  // Step a cumulative angle forward clockwise to match a target mod4 (1..4)
  function stepAngleToMod4(currentDeg, targetMod4) {
    const currentModIndex = (((currentDeg / 90) % 4) + 4) % 4;
    const targetModIndex = targetMod4 - 1;
    const deltaSteps = (targetModIndex - currentModIndex + 4) % 4;
    return currentDeg + deltaSteps * 90;
  }

  // Resolve which underlying sub-grid (0..3) currently occupies fixed screen quadrant (0=TL, 1=TR, 2=BL, 3=BR)
  function getLogicalSubGridAtScreenQuad(screenQuad) {
    const screenRingPos = CW_RING.indexOf(screenQuad);
    const masterSteps = (state.masterMod4 - 1) % 4;
    const logicalRingPos = (screenRingPos - masterSteps + 4) % 4;
    return CW_RING[logicalRingPos];
  }

  // Get the current orientation (1..4) of each fixed screen quadrant Q1(TL), Q2(TR), Q3(BL), Q4(BR)
  function getScreenQuadrantOrientations() {
    return [0, 1, 2, 3].map(sq => {
      const subIdx = getLogicalSubGridAtScreenQuad(sq);
      return state.subMod4[subIdx];
    });
  }

  // Initialize Dual-Layer DOM
  function initGridDOM() {
    staticBedEl.innerHTML = "";
    quadCarrierEls.forEach(qc => (qc.innerHTML = ""));

    // Build Static Reference Bed (01 Top-Left -> 36 Bottom-Right)
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 6; c++) {
        const idx = r * 6 + c;
        const taiNum = idx + 1;
        const taiStr = String(taiNum).padStart(2, "0");
        const stdChar = STD_ALPHABET[idx];
        const staticMod4 = getMod4(taiNum);
        const staticMod10 = getMod10Display(taiNum);
        const staticSym = STATIC_SYMBOLS[idx];
        const screenQuad = (r >= 3 ? 2 : 0) + (c >= 3 ? 1 : 0);

        const cell = document.createElement("div");
        cell.className = "static-cell";
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.dataset.screenQuad = screenQuad;

        cell.innerHTML = `
          <span class="ref-tl">${taiStr}</span>
          <span class="ref-tr">${stdChar}</span>
          <span class="ref-bl">${staticMod4}</span>
          <span class="ref-bm">${staticSym}</span>
          <span class="ref-br">${staticMod10}</span>
        `;

        cell.addEventListener("click", e => {
          e.stopPropagation();
          rotateScreenQuadrantCW(screenQuad);
        });

        staticBedEl.appendChild(cell);
      }
    }

    // Build Physical Moving Carrier Slots
    for (let q = 0; q < 4; q++) {
      const r0 = q >= 2 ? 3 : 0;
      const c0 = q % 2 === 1 ? 3 : 0;

      for (let qr = 0; qr < 3; qr++) {
        for (let qc = 0; qc < 3; qc++) {
          const globalRow = r0 + qr;
          const globalCol = c0 + qc;
          const idx = globalRow * 6 + globalCol;

          const slot = document.createElement("div");
          slot.className = "moving-slot";

          const glyph = document.createElement("span");
          glyph.className = "gimbal-glyph";
          glyph.dataset.idx = idx;
          glyph.dataset.quad = q;
          glyph.textContent = STD_ALPHABET[idx];

          slot.appendChild(glyph);
          quadCarrierEls[q].appendChild(slot);
        }
      }
    }
  }

  // Rotate whichever sub-grid is currently sitting in fixed screen quadrant `screenQuad`
  function rotateScreenQuadrantCW(screenQuad) {
    const logicalSub = getLogicalSubGridAtScreenQuad(screenQuad);
    state.subMod4[logicalSub] = (state.subMod4[logicalSub] % 4) + 1;
    state.subDeg[logicalSub] += 90;
    applyPhysicalRotations();

    if (state.mode === "encode") runEncode(ioInput.value);
    if (state.mode === "decode") runDecode(ioInput.value);
  }

  // Step 2: Set fixed Screen Quadrants Q1(TL), Q2(TR), Q3(BL), Q4(BR) from first 4 keyed chars
  function applyKeywordToScreenQuadrants() {
    for (let screenQuad = 0; screenQuad < 4; screenQuad++) {
      const targetOrient = getMod4(getTAI(state.keyedAlphabet[screenQuad]));
      const logicalSub = getLogicalSubGridAtScreenQuad(screenQuad);
      state.subDeg[logicalSub] = stepAngleToMod4(state.subDeg[logicalSub], targetOrient);
      state.subMod4[logicalSub] = targetOrient;
    }
  }

  // Update moving glyph characters
  function updateCarrierCharacters() {
    const glyphs = masterCarrierEl.querySelectorAll(".gimbal-glyph");
    glyphs.forEach(g => {
      const idx = Number(g.dataset.idx);
      g.textContent = state.keyedAlphabet[idx];
    });
  }

  // Apply Smooth Physical CSS Transforms + Counter-Rotating Gimbals + Telemetry
  function applyPhysicalRotations() {
    masterCarrierEl.style.transform = `rotate(${state.masterDeg}deg)`;

    for (let q = 0; q < 4; q++) {
      quadCarrierEls[q].style.transform = `rotate(${state.subDeg[q]}deg)`;
      const totalDeg = state.masterDeg + state.subDeg[q];
      const glyphs = quadCarrierEls[q].querySelectorAll(".gimbal-glyph");
      glyphs.forEach(g => {
        g.style.transform = `rotate(${-totalDeg}deg)`;
      });
    }

    const screenQuads = getScreenQuadrantOrientations();
    const configStr = `${state.masterMod4} | ${screenQuads.join("")}`;
    const isFlat = state.masterMod4 === 1 && screenQuads.every(v => v === 1);
    rotorStateBadge.textContent = configStr;
    rimConfigFooter.textContent = `CONFIG: ${configStr}${isFlat ? " (FLAT)" : ""}`;

    const normalizedMasterDeg = (state.masterMod4 - 1) * 90;
    const hintChar = STD_ALPHABET[state.masterMod4 - 1];
    masterAngleLabel.textContent = `MOD ${state.masterMod4} · ${normalizedMasterDeg}° (HINT ${hintChar})`;

    const nextMod = (state.masterMod4 % 4) + 1;
    cycleMasterBtn.textContent = `Rotate Master (${state.masterMod4} → ${nextMod})`;
  }

  // Mathematical Matrix Lookup matching the exact Physical Rotations
  function rotateMatrixCW(mat, times) {
    let res = mat.map(row => [...row]);
    const n = res.length;
    const turns = ((times % 4) + 4) % 4;
    for (let t = 0; t < turns; t++) {
      const next = Array.from({ length: n }, () => Array(n).fill(0));
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          next[c][n - 1 - r] = res[r][c];
        }
      }
      res = next;
    }
    return res;
  }

  function getPermutedGrid() {
    let grid = Array.from({ length: 6 }, (_, r) =>
      Array.from({ length: 6 }, (_, c) => r * 6 + c)
    );

    for (let q = 0; q < 4; q++) {
      const r0 = q >= 2 ? 3 : 0;
      const c0 = q % 2 === 1 ? 3 : 0;
      const sub = [
        [grid[r0][c0], grid[r0][c0 + 1], grid[r0][c0 + 2]],
        [grid[r0 + 1][c0], grid[r0 + 1][c0 + 1], grid[r0 + 1][c0 + 2]],
        [grid[r0 + 2][c0], grid[r0 + 2][c0 + 1], grid[r0 + 2][c0 + 2]]
      ];
      const rotSub = rotateMatrixCW(sub, state.subMod4[q] - 1);
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          grid[r0 + r][c0 + c] = rotSub[r][c];
        }
      }
    }

    grid = rotateMatrixCW(grid, state.masterMod4 - 1);
    return grid;
  }

  // Render the Tappable 36-Char Keyed Sequence Strip (Mod 4 vs Mod 10)
  function renderTAIStrip() {
    taiStripEl.innerHTML = "";
    const isMod4 = state.taiStripMode === "mod4";

    taiModeLabel.textContent = isMod4 ? "TAI MOD 4" : "TAI MOD 10";
    taiModeLabel.classList.toggle("mod4-tint", isMod4);
    taiModeLabel.classList.toggle("mod10-tint", !isMod4);

    state.keyedAlphabet.forEach((ch, idx) => {
      const chip = document.createElement("div");
      chip.className = "tai-chip" + (idx < 4 ? " key-driver" : "");
      const tai = getTAI(ch);
      const val = isMod4 ? getMod4(tai) : getMod10Display(tai);
      const valClass = isMod4 ? "mod4-val" : "mod10-val";
      chip.innerHTML = `<div class="c-char">${ch}</div><div class="c-idx ${valClass}">${val}</div>`;
      taiStripEl.appendChild(chip);
    });
  }

  // Tapping anywhere in the Keyed Sequence card toggles Mod 4 <-> Mod 10
  taiCard.addEventListener("click", () => {
    state.taiStripMode = state.taiStripMode === "mod4" ? "mod10" : "mod4";
    renderTAIStrip();
  });

  // Compute Index of Coincidence (IoC)
  function computeIoC(text) {
    const clean = text.toUpperCase().replace(/[^A-Z0-9]/g, "");
    const N = clean.length;
    if (N < 2) return 0;
    const freq = {};
    for (const ch of clean) freq[ch] = (freq[ch] || 0) + 1;
    let sum = 0;
    for (const k in freq) sum += freq[k] * (freq[k] - 1);
    return sum / (N * (N - 1));
  }

  // Live Encode
  function runEncode(plaintext) {
    const raw = plaintext.toUpperCase();
    const firstValid = raw.match(/[A-Z0-9]/);
    if (!firstValid) {
      firstCharInfo.textContent = "1ST CHAR: —";
      ioOutput.value = "";
      iocReadout.textContent = "IoC: —";
      hintReadout.textContent = "Tail Hint: —";
      return;
    }

    // Step 1: Rotate Master Grid to TAI Mod 4 of first plaintext character
    const firstCh = firstValid[0];
    const firstTAI = getTAI(firstCh);
    const targetMaster = getMod4(firstTAI);
    state.masterDeg = stepAngleToMod4(state.masterDeg, targetMaster);
    state.masterMod4 = targetMaster;

    // Step 2: Set Screen Quadrants Q1..Q4 from first four keyed characters
    applyKeywordToScreenQuadrants();
    applyPhysicalRotations();
    firstCharInfo.textContent = `1ST CHAR: ${firstCh} (TAI ${firstTAI} → MOD ${state.masterMod4})`;

    const mat = getPermutedGrid();
    const flatOrder = mat.flat().map(idx => state.keyedAlphabet[idx]);
    const screenQuads = getScreenQuadrantOrientations();

    const words = raw.trim().split(/\s+/).filter(Boolean);
    const encodedWords = [];
    let step = 0;

    words.forEach((word, wIdx) => {
      const hasNumber = /\d/.test(word);
      const cleanChars = word.replace(/[^A-Z0-9]/g, "");
      if (!cleanChars) return;

      let out = "";
      for (let i = 0; i < cleanChars.length; i++) {
        const ch = cleanChars[i];
        const pIdx = flatOrder.indexOf(ch);
        const rotorShift =
          (step * 7 +
            Math.floor(step / 3) * 5 +
            Math.floor(step / 6) * 11 +
            wIdx * 3 +
            state.masterMod4) %
          36;
        out += flatOrder[(pIdx + rotorShift) % 36];
        step++;
      }

      if (hasNumber) out = `Z${out}Z`;
      encodedWords.push(out);
    });

    let joined = "";
    encodedWords.forEach((ew, idx) => {
      joined += ew;
      if (idx < encodedWords.length - 1) {
        const delim = ((idx + state.masterMod4 + screenQuads[0]) % 9) + 1;
        joined += String(delim);
      }
    });

    const tailHint = STD_ALPHABET[state.masterMod4 - 1];
    const finalCipher = joined ? `${joined}${tailHint}` : "";

    ioOutput.value = finalCipher;
    const ioc = computeIoC(finalCipher);
    iocReadout.textContent = `IoC: ${ioc.toFixed(4)} (Noise ≈ 0.0278)`;
    hintReadout.textContent = `Tail Hint: ${tailHint} (Mod ${state.masterMod4})`;
  }

  // Live Decode
  function runDecode(ciphertext) {
    const cleanAll = ciphertext.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (cleanAll.length < 2) {
      firstCharInfo.textContent = "TAIL HINT: —";
      ioOutput.value = "";
      return;
    }

    // Step 1: Rotate Master Grid to TAI Mod 4 of trailing ciphertext character
    const tailHint = cleanAll.slice(-1);
    const hintTAI = getTAI(tailHint);
    const targetMaster = getMod4(hintTAI);
    state.masterDeg = stepAngleToMod4(state.masterDeg, targetMaster);
    state.masterMod4 = targetMaster;

    // Step 2: Set Screen Quadrants Q1..Q4 from first four keyed characters
    applyKeywordToScreenQuadrants();
    applyPhysicalRotations();
    firstCharInfo.textContent = `TAIL HINT: ${tailHint} → MASTER MOD ${state.masterMod4}`;

    const body = ciphertext.trim().toUpperCase().slice(0, -1);
    const mat = getPermutedGrid();
    const flatOrder = mat.flat().map(idx => state.keyedAlphabet[idx]);

    const tokens = body.split(/[1-9]/).filter(Boolean);
    const decodedWords = [];
    let step = 0;

    tokens.forEach((tok, wIdx) => {
      let core = tok.replace(/[^A-Z0-9]/g, "");
      if (core.startsWith("Z") && core.endsWith("Z") && core.length > 2) {
        core = core.slice(1, -1);
      }
      let plainWord = "";
      for (let i = 0; i < core.length; i++) {
        const cChar = core[i];
        const cIdx = flatOrder.indexOf(cChar);
        const rotorShift =
          (step * 7 +
            Math.floor(step / 3) * 5 +
            Math.floor(step / 6) * 11 +
            wIdx * 3 +
            state.masterMod4) %
          36;
        const pIdx = (cIdx - rotorShift + 360) % 36;
        plainWord += flatOrder[pIdx];
        step++;
      }
      decodedWords.push(plainWord);
    });

    ioOutput.value = decodedWords.join(" ");
    iocReadout.textContent = `Recovered: ${decodedWords.length} word(s)`;
    hintReadout.textContent = `Master Lock: Mod ${state.masterMod4}`;
  }

  // Handle Keyword Changes: Loads flat 1 | 1111 in Reference Mode
  function handleKeywordUpdate() {
    state.keyedAlphabet = buildKeyedAlphabet(state.keyword);
    const cleanLen = state.keyword.replace(/[^A-Z0-9]/gi, "").length;
    keyLenLabel.textContent = cleanLen > 0 ? `KEY LEN: ${cleanLen}` : "STANDARD TAI";
    renderTAIStrip();
    updateCarrierCharacters();

    if (state.mode === "reference") {
      state.masterMod4 = 1;
      state.masterDeg = stepAngleToMod4(state.masterDeg, 1);
      for (let q = 0; q < 4; q++) {
        state.subMod4[q] = 1;
        state.subDeg[q] = stepAngleToMod4(state.subDeg[q], 1);
      }
      applyPhysicalRotations();
    } else if (state.mode === "encode") {
      runEncode(ioInput.value);
    } else if (state.mode === "decode") {
      runDecode(ioInput.value);
    }
  }

  // Helper to cycle Master Grid 1 -> 2 -> 3 -> 4 -> 1
  function cycleMasterGridCW() {
    state.masterMod4 = (state.masterMod4 % 4) + 1;
    state.masterDeg += 90;
    applyPhysicalRotations();
    if (state.mode === "encode") runEncode(ioInput.value);
    if (state.mode === "decode") runDecode(ioInput.value);
  }

  // Single Cycle Master Button
  cycleMasterBtn.addEventListener("click", cycleMasterGridCW);

  // Tapping anywhere on the outer Master Rim also cycles Master Grid 90° CW
  masterOuterRim.addEventListener("click", e => {
    if (e.target.closest(".static-cell")) return;
    cycleMasterGridCW();
  });

  // Keyword Input & Spin Key
  keywordInput.addEventListener("input", e => {
    state.keyword = e.target.value;
    handleKeywordUpdate();
  });

  spinKeyBtn.addEventListener("click", () => {
    const samples = ["KEYWORD", "VOYAGER", "FREMONT", "CIPHER36", "OBLIVION", "STANLEY", "TACOMA21", "AURORA"];
    const pick = samples[Math.floor(Math.random() * samples.length)];
    keywordInput.value = pick;
    state.keyword = pick;
    handleKeywordUpdate();
  });

  // Engage Keyed Screen Quadrant Orientations (Step 2)
  applyKeyRotorsBtn.addEventListener("click", () => {
    applyKeywordToScreenQuadrants();
    applyPhysicalRotations();
    if (state.mode === "encode") runEncode(ioInput.value);
    if (state.mode === "decode") runDecode(ioInput.value);
  });

  // Swap Symbols / Characters Toggle
  swapSymbolsBtn.addEventListener("click", () => {
    state.symbolSwapMode = !state.symbolSwapMode;
    gridArenaEl.classList.toggle("symbol-swap-mode", state.symbolSwapMode);
    swapSymbolsBtn.classList.toggle("active", state.symbolSwapMode);
  });

  // Reset to 1 | 1111 Flat Configuration
  resetFlatBtn.addEventListener("click", () => {
    state.masterMod4 = 1;
    state.masterDeg = stepAngleToMod4(state.masterDeg, 1);
    for (let q = 0; q < 4; q++) {
      state.subMod4[q] = 1;
      state.subDeg[q] = stepAngleToMod4(state.subDeg[q], 1);
    }
    applyPhysicalRotations();
  });

  // Mode Switcher
  modeBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      modeBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.mode = btn.dataset.mode;

      if (state.mode === "reference") {
        ioCard.classList.remove("visible");
      } else if (state.mode === "encode") {
        ioCard.classList.add("visible");
        ioInputLabel.textContent = "Plaintext Input";
        ioOutputLabel.textContent = "RGC36 Ciphertext Output";
        ioInput.placeholder = "Enter plaintext (1st char sets Master Mod 4)...";
        runEncode(ioInput.value);
      } else if (state.mode === "decode") {
        ioCard.classList.add("visible");
        ioInputLabel.textContent = "RGC36 Ciphertext Input";
        ioOutputLabel.textContent = "Recovered Plaintext";
        ioInput.placeholder = "Paste RGC36 ciphertext with trailing hint...";
        runDecode(ioInput.value);
      }
    });
  });

  ioInput.addEventListener("input", () => {
    if (state.mode === "encode") runEncode(ioInput.value);
    if (state.mode === "decode") runDecode(ioInput.value);
  });

  copyOutputBtn.addEventListener("click", () => {
    if (!ioOutput.value) return;
    navigator.clipboard.writeText(ioOutput.value);
    copyOutputBtn.textContent = "Copied!";
    setTimeout(() => (copyOutputBtn.textContent = "Copy"), 1200);
  });

  // ============================================================================
  // Reactive Nebula Clouds & Particle Constellation Background
  // Seeded dynamically by active 5-rotor configuration (M | Q1 Q2 Q3 Q4)
  // ============================================================================
  const canvas = document.getElementById("nebula-canvas");
  const ctx = canvas.getContext("2d");
  let particles = [];
  let clouds = [];

  function initParticlesAndClouds() {
    const w = (canvas.width = window.innerWidth);
    const h = (canvas.height = window.innerHeight);

    clouds = Array.from({ length: 4 }, (_, i) => ({
      bx: (0.2 + i * 0.2) * w,
      by: (0.25 + ((i % 2) * 0.45)) * h,
      radius: Math.max(w, h) * (0.36 + i * 0.06),
      phase: i * 1.57,
      speed: 0.00035 + i * 0.00012
    }));

    particles = Array.from({ length: 95 }, (_, i) => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      size: Math.random() * 1.9 + 0.5,
      phase: Math.random() * Math.PI * 2,
      group: i % 4
    }));
  }

  function renderReactiveNebula(ts) {
    const w = canvas.width;
    const h = canvas.height;

    const m = state.masterMod4;
    const screenQuads = getScreenQuadrantOrientations();
    const [q1, q2, q3, q4] = screenQuads;
    const rotorSig = m * 29 + q1 * 17 + q2 * 23 + q3 * 31 + q4 * 37;
    const baseHue = (255 + rotorSig * 3.4) % 360;

    ctx.fillStyle = "#070510";
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = "lighter";
    clouds.forEach((cl, idx) => {
      const qVal = screenQuads[idx];
      const orbitAngle = ts * cl.speed * (0.7 + qVal * 0.35) + cl.phase + (m - 1) * 0.8;
      const cx = cl.bx + Math.cos(orbitAngle) * (w * 0.12);
      const cy = cl.by + Math.sin(orbitAngle * 0.85) * (h * 0.12);
      const hue = (baseHue + idx * 38 + qVal * 19) % 360;

      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, cl.radius);
      grad.addColorStop(0, `hsla(${hue}, 78%, 26%, 0.24)`);
      grad.addColorStop(0.5, `hsla(${(hue + 28) % 360}, 68%, 15%, 0.11)`);
      grad.addColorStop(1, "rgba(7, 5, 16, 0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, cl.radius, 0, Math.PI * 2);
      ctx.fill();
    });

    const speedScale = 0.65 + (m + q1 + q2 + q3 + q4) * 0.14;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const qBias = screenQuads[p.group];
      const swirlAngle = ((m - 1) * 0.5 + (qBias - 1) * 0.35);

      p.x += (p.vx * Math.cos(swirlAngle) - p.vy * Math.sin(swirlAngle)) * speedScale;
      p.y += (p.vx * Math.sin(swirlAngle) + p.vy * Math.cos(swirlAngle)) * speedScale;

      if (p.x < 0) p.x += w;
      if (p.x > w) p.x -= w;
      if (p.y < 0) p.y += h;
      if (p.y > h) p.y -= h;

      p.phase += 0.015;
      const alpha = 0.3 + Math.sin(p.phase) * 0.25;
      const pHue = (baseHue + p.group * 42) % 360;

      ctx.fillStyle = `hsla(${pHue}, 85%, 76%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();

      for (let j = i + 1; j < particles.length; j += 3) {
        const p2 = particles[j];
        if (p.group !== p2.group) continue;
        const dx = p.x - p2.x;
        const dy = p.y - p2.y;
        const distSq = dx * dx + dy * dy;
        if (distSq < 9500) {
          const lineAlpha = (1 - distSq / 9500) * 0.16;
          ctx.strokeStyle = `hsla(${pHue}, 80%, 70%, ${lineAlpha})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    }

    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(renderReactiveNebula);
  }

  window.addEventListener("resize", initParticlesAndClouds);

  // Boot Application
  initGridDOM();
  handleKeywordUpdate();
  initParticlesAndClouds();
  requestAnimationFrame(renderReactiveNebula);
})();
</script>
